@keyframes flick{0%{transform:scale(1,1)}35%{transform:scale(.94,1.08)}70%{transform:scale(1.04,.95)}100%{transform:scale(.97,1.05)}}
@media (prefers-reduced-motion:reduce){.l,.fl{animation:none}}
</style>
